<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AimStore - Access Gateway</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
    
    body {
      background: radial-gradient(circle at 50% 30%, #1e1b4b 0%, #090d16 80%);
      color: #f3f4f6;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .card {
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(99, 102, 241, 0.2);
      border-radius: 24px;
      padding: 35px 30px;
      max-width: 420px;
      width: 100%;
      text-align: center;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.7);
    }

    .logo-container { margin-bottom: 15px; }
    .logo-container img { width: 55px; height: 55px; object-fit: contain; }

    h1 {
      font-size: 1.6rem;
      font-weight: 700;
      margin-bottom: 8px;
      color: #ffffff;
    }

    p {
      color: #94a3b8;
      font-size: 0.88rem;
      margin-bottom: 25px;
      line-height: 1.5;
    }

    .checkpoint-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      font-size: 0.85rem;
      color: #cbd5e1;
      font-weight: 600;
    }

    .progress-bar {
      width: 100%;
      height: 8px;
      background: rgba(30, 27, 75, 0.8);
      border-radius: 10px;
      overflow: hidden;
      margin-bottom: 25px;
      border: 1px solid rgba(99, 102, 241, 0.2);
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #38bdf8, #818cf8);
      transition: width 0.4s ease;
    }

    .key-box {
      background: rgba(30, 27, 75, 0.6);
      border: 1px solid rgba(129, 140, 248, 0.3);
      border-radius: 12px;
      padding: 14px;
      font-family: monospace;
      font-size: 1.3rem;
      font-weight: 700;
      color: #38bdf8;
      letter-spacing: 2px;
      margin-bottom: 20px;
      user-select: all;
    }

    .btn {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
      color: white;
      border: none;
      border-radius: 12px;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 4px 15px rgba(79, 70, 229, 0.4);
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
    }

    .btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(79, 70, 229, 0.6);
      background: linear-gradient(135deg, #4338ca 0%, #6d28d9 100%);
    }

    .status-text {
      margin-top: 15px;
      font-size: 0.8rem;
      color: #64748b;
    }

    .hidden { display: none; }
  </style>
</head>
<body>

  <div class="card">
    <div class="logo-container">
      <img src="logo.png" alt="AimStore Logo" onerror="this.style.display='none'">
    </div>
    <h1>AIM Store</h1>

    <!-- VUE SYSTEME DE CHECKPOINTS -->
    <div id="checkpointSection">
      <p id="cpDescription">Complétez les étapes de vérification pour débloquer votre clé d'accès.</p>

      <div class="checkpoint-header">
        <span id="cpTitle">Checkpoint #1</span>
        <span id="stepCounter">0/2 Complété</span>
      </div>
      <div class="progress-bar">
        <div class="progress-fill" id="progressFill"></div>
      </div>

      <button class="btn" id="checkpointBtn" onclick="handleCheckpoint()">
        <span>Open Checkpoint</span> 🔗
      </button>
      <div class="status-text" id="cpStatus">Étape 1 sur 2 requise.</div>
    </div>

    <!-- VUE FINALE : CLÉ GÉNÉRÉE (APPRÈS STEP 2) -->
    <div id="keySection" class="hidden">
      <p>Toutes les étapes ont été validées ! Voici votre clé d'accès sécurisée de 24h :</p>

      <div class="key-box" id="keyBox">Chargement...</div>

      <button class="btn" onclick="copyKey()">Copier la clé</button>
      <div class="status-text" id="keyStatus">Vérification en cours...</div>
    </div>
  </div>

  <script>
    // 🔗 TES VRAIS LIENS INTEGRÉS :
    const WORKINK_URL = "https://work.ink/370E/aimstore"; 
    const LINKVERTISE_URL = "https://link-center.net/10344688/ujQeZfYkD4gD"; 

    // Lecture du paramètre ?step= dans l'URL
    const urlParams = new URLSearchParams(window.location.search);
    const currentStepParam = urlParams.get('step');

    const cpTitle = document.getElementById('cpTitle');
    const stepCounter = document.getElementById('stepCounter');
    const progressFill = document.getElementById('progressFill');
    const checkpointBtn = document.getElementById('checkpointBtn');
    const cpStatus = document.getElementById('cpStatus');

    // Gestion de l'état selon l'étape renvoyée
    if (currentStepParam === '1') {
      // ÉTAPE 1 COMPLÉTÉE (Retour de Workink)
      cpTitle.textContent = "Checkpoint #2";
      stepCounter.textContent = "1/2 Complété";
      progressFill.style.width = "50%";
      checkpointBtn.innerHTML = "<span>Continuer (Checkpoint #2)</span> 🚀";
      cpStatus.textContent = "Workink validé ! Cliquez sur Continuer pour accéder à Linkvertise.";
    } 
    else if (currentStepParam === '2') {
      // ÉTAPE 2 COMPLÉTÉE (Retour de Linkvertise)
      cpTitle.textContent = "Vérification terminée";
      stepCounter.textContent = "2/2 Complété";
      progressFill.style.width = "100%";
      checkpointBtn.innerHTML = "<span>Obtenir ma clé</span> 🔑";
      cpStatus.textContent = "Toutes les étapes sont validées ! Cliquez pour afficher votre clé.";
    }

    function handleCheckpoint() {
      if (!currentStepParam || currentStepParam === '0') {
        // Envoi vers Workink
        window.location.href = WORKINK_URL;
      } 
      else if (currentStepParam === '1') {
        // Envoi vers Linkvertise
        window.location.href = LINKVERTISE_URL;
      } 
      else if (currentStepParam === '2') {
        // Affichage de la clé finale
        document.getElementById('checkpointSection').classList.add('hidden');
        document.getElementById('keySection').classList.remove('hidden');
        loadKey();
      }
    }

    async function loadKey() {
      const keyBox = document.getElementById('keyBox');
      const keyStatus = document.getElementById('keyStatus');

      try {
        const response = await fetch('/api/generate');
        const data = await response.json();

        if (data.success) {
          keyBox.textContent = data.key;
          if (data.isExisting) {
            keyStatus.textContent = `Clé active (${data.remainingHours}h restantes)`;
          } else {
            keyStatus.textContent = `Nouvelle clé créée avec succès !`;
          }
        } else {
          keyBox.textContent = "ERREUR";
          keyStatus.textContent = data.message || "Impossible de générer la clé.";
        }
      } catch (err) {
        keyBox.textContent = "ERREUR";
        keyStatus.textContent = "Erreur de connexion avec le serveur.";
      }
    }

    function copyKey() {
      const key = document.getElementById('keyBox').textContent;
      if (key && key !== "Chargement..." && key !== "ERREUR") {
        navigator.clipboard.writeText(key);
        alert("Clé copiée dans le presse-papier !");
      }
    }
  </script>
</body>
</html>
