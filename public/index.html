<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AimStore - Key Access</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      /* 🎨 COULEURS DU LAUNCHER AIMSTORE (Ajuste les valeurs si besoin) */
      --bg-main: #0b0e14;
      --card-bg: rgba(18, 24, 38, 0.85);
      --accent-primary: #6366f1;   /* Violet / Bleu Neon du Launcher */
      --accent-hover: #4f46e5;
      --accent-glow: rgba(99, 102, 241, 0.4);
      --text-title: #ffffff;
      --text-sub: #94a3b8;
      --key-text: #38bdfe;
      --border-color: rgba(99, 102, 241, 0.25);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
    
    body {
      background: var(--bg-main);
      background-image: 
        radial-gradient(circle at 50% 10%, rgba(99, 102, 241, 0.15) 0%, transparent 60%),
        radial-gradient(circle at 80% 90%, rgba(56, 189, 248, 0.08) 0%, transparent 50%);
      color: #f3f4f6;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .card {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border-color);
      border-radius: 24px;
      padding: 40px;
      max-width: 440px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), 0 0 30px var(--accent-glow);
    }

    .badge {
      display: inline-block;
      padding: 6px 16px;
      background: rgba(99, 102, 241, 0.12);
      color: var(--key-text);
      border: 1px solid rgba(56, 189, 248, 0.3);
      border-radius: 50px;
      font-size: 0.75rem;
      font-weight: 700;
      margin-bottom: 22px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
    }

    h1 {
      font-size: 2rem;
      font-weight: 800;
      margin-bottom: 12px;
      color: var(--text-title);
      letter-spacing: -0.5px;
    }

    p {
      color: var(--text-sub);
      font-size: 0.92rem;
      margin-bottom: 28px;
      line-height: 1.6;
    }

    .key-box {
      background: rgba(7, 10, 19, 0.9);
      border: 1.5px dashed var(--accent-primary);
      border-radius: 14px;
      padding: 18px;
      font-family: 'Courier New', monospace;
      font-size: 1.5rem;
      font-weight: 800;
      color: var(--key-text);
      letter-spacing: 3px;
      margin-bottom: 24px;
      text-shadow: 0 0 12px var(--accent-glow);
      user-select: all;
    }

    .btn-copy {
      width: 100%;
      padding: 16px;
      background: linear-gradient(135deg, var(--accent-primary) 0%, #3b82f6 100%);
      color: white;
      border: none;
      border-radius: 14px;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.25s ease;
      box-shadow: 0 6px 20px var(--accent-glow);
    }

    .btn-copy:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(99, 102, 241, 0.6);
      background: linear-gradient(135deg, var(--accent-hover) 0%, #2563eb 100%);
    }

    .status-text {
      margin-top: 18px;
      font-size: 0.85rem;
      color: #64748b;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="badge">Session Validée</div>
    <h1>AimStore</h1>
    <p>Votre clé temporaire est prête. Copiez-la et collez-la dans le launcher <strong>AimStore</strong> pour débloquer l'accès pendant 24 heures.</p>

    <div class="key-box" id="keyBox">Chargement...</div>

    <button class="btn-copy" onclick="copyKey()">Copier la clé</button>
    <div class="status-text" id="statusText">Vérification en cours...</div>
  </div>

  <script>
    async function loadKey() {
      const keyBox = document.getElementById('keyBox');
      const statusText = document.getElementById('statusText');

      try {
        const response = await fetch('/api/generate');
        const data = await response.json();

        if (data.success) {
          keyBox.textContent = data.key;
          if (data.isExisting) {
            statusText.textContent = `Clé active réaffichée (${data.remainingHours}h restantes)`;
          } else {
            statusText.textContent = `Nouvelle clé créée ! Valide 24 heures.`;
          }
        } else {
          keyBox.textContent = "ERREUR";
          statusText.textContent = data.message || "Impossible de générer la clé.";
        }
      } catch (err) {
        keyBox.textContent = "ERREUR";
        statusText.textContent = "Erreur de connexion au serveur.";
      }
    }

    function copyKey() {
      const key = document.getElementById('keyBox').textContent;
      if (key && key !== "Chargement..." && key !== "ERREUR") {
        navigator.clipboard.writeText(key);
        alert("Clé copiée avec succès !");
      }
    }

    loadKey();
  </script>
</body>
</html>
