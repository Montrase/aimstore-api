<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AimStore - Clé d'Accès</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
    
    body {
      background: radial-gradient(circle at 50% 30%, #1e1b4b 0%, #090d16 80%);
      color: #f3f4f6;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .card {
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(99, 102, 241, 0.2);
      border-radius: 24px;
      padding: 35px 30px;
      max-width: 400px;
      width: 100%;
      text-align: center;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.7);
    }

    .logo-container {
      margin-bottom: 15px;
    }

    .logo-container img {
      width: 48px;
      height: 48px;
      object-fit: contain;
    }

    h1 {
      font-size: 1.6rem;
      font-weight: 700;
      margin-bottom: 8px;
      color: #ffffff;
    }

    p {
      color: #94a3b8;
      font-size: 0.88rem;
      margin-bottom: 25px;
      line-height: 1.5;
    }

    .key-box {
      background: rgba(30, 27, 75, 0.6);
      border: 1px solid rgba(129, 140, 248, 0.3);
      border-radius: 12px;
      padding: 14px;
      font-family: monospace;
      font-size: 1.3rem;
      font-weight: 700;
      color: #38bdf8;
      letter-spacing: 2px;
      margin-bottom: 20px;
      user-select: all;
    }

    .btn {
      width: 100%;
      padding: 13px;
      background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
      color: white;
      border: none;
      border-radius: 12px;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 4px 15px rgba(79, 70, 229, 0.4);
      margin-bottom: 12px;
    }

    .btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(79, 70, 229, 0.6);
      background: linear-gradient(135deg, #4338ca 0%, #6d28d9 100%);
    }

    .status-text {
      margin-top: 10px;
      font-size: 0.8rem;
      color: #64748b;
    }
  </style>
</head>
<body>

  <<div class="logo-container">
      <img src="logo.png" alt="AimStore Logo">
    </div>
    <p>Votre clé d'accès sécurisée de 24 heures est prête. Copiez-la pour l'utiliser dans le launcher.</p>

    <div class="key-box" id="keyBox">Chargement...</div>

    <button class="btn" onclick="copyKey()">Copier la clé</button>
    <div class="status-text" id="statusText">Vérification en cours...</div>
  </div>

  <script>
    async function loadKey() {
      const keyBox = document.getElementById('keyBox');
      const statusText = document.getElementById('statusText');

      try {
        const response = await fetch('/api/generate');
        const data = await response.json();

        if (data.success) {
          keyBox.textContent = data.key;
          if (data.isExisting) {
            statusText.textContent = `Clé active (${data.remainingHours}h restantes)`;
          } else {
            statusText.textContent = `Nouvelle clé générée avec succès !`;
          }
        } else {
          keyBox.textContent = "ERREUR";
          statusText.textContent = data.message || "Erreur de génération.";
        }
      } catch (err) {
        keyBox.textContent = "ERREUR";
        statusText.textContent = "Erreur de communication avec le serveur.";
      }
    }

    function copyKey() {
      const key = document.getElementById('keyBox').textContent;
      if (key && key !== "Chargement..." && key !== "ERREUR") {
        navigator.clipboard.writeText(key);
        alert("Clé copiée dans le presse-papier !");
      }
    }

    loadKey();
  </script>
</body>
</html>
