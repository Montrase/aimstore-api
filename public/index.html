<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AimStore - Clé d'Accès</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
    body {
      background: #090d16;
      color: #f3f4f6;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .card {
      background: rgba(17, 24, 39, 0.8);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 20px;
      padding: 40px;
      max-width: 420px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
    }
    .badge {
      display: inline-block;
      padding: 6px 14px;
      background: rgba(56, 189, 248, 0.1);
      color: #38bdf8;
      border-radius: 50px;
      font-size: 0.8rem;
      font-weight: 600;
      margin-bottom: 20px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    h1 { font-size: 1.8rem; font-weight: 800; margin-bottom: 10px; color: #ffffff; }
    p { color: #9ca3af; font-size: 0.95rem; margin-bottom: 30px; line-height: 1.5; }
    .key-box {
      background: #030712;
      border: 1px dashed rgba(56, 189, 248, 0.4);
      border-radius: 12px;
      padding: 16px;
      font-family: monospace;
      font-size: 1.4rem;
      font-weight: 700;
      color: #4ade80;
      letter-spacing: 3px;
      margin-bottom: 20px;
      user-select: all;
    }
    .btn-copy {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #0284c7 0%, #2563eb 100%);
      color: white;
      border: none;
      border-radius: 12px;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 4px 15px rgba(2, 132, 199, 0.3);
    }
    .btn-copy:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(2, 132, 199, 0.5); }
    .status-text { margin-top: 15px; font-size: 0.85rem; color: #6b7280; }
  </style>
</head>
<body>

  <div class="card">
    <div class="badge">Vérification Réussie</div>
    <h1>AimStore Key</h1>
    <p>Voici votre clé temporaire d'accès de 24 heures. Copiez-la et collez-la dans le launcher <strong>AimStore</strong>.</p>

    <div class="key-box" id="keyBox">Chargement...</div>

    <button class="btn-copy" onclick="copyKey()">Copier la clé</button>
    <div class="status-text" id="statusText">Génération en cours...</div>
  </div>

  <script>
    async function loadKey() {
      const keyBox = document.getElementById('keyBox');
      const statusText = document.getElementById('statusText');

      try {
        const response = await fetch('/api/generate');
        const data = await response.json();

        if (data.success) {
          keyBox.textContent = data.key;
          if (data.isExisting) {
            statusText.textContent = `Clé déjà active (${data.remainingHours}h restantes)`;
          } else {
            statusText.textContent = `Nouvelle clé créée ! Valide 24 heures.`;
          }
        } else {
          keyBox.textContent = "ERREUR";
          statusText.textContent = data.message || "Impossible de générer la clé.";
        }
      } catch (err) {
        keyBox.textContent = "ERREUR";
        statusText.textContent = "Erreur de communication avec le serveur.";
      }
    }

    function copyKey() {
      const key = document.getElementById('keyBox').textContent;
      if (key && key !== "Chargement..." && key !== "ERREUR") {
        navigator.clipboard.writeText(key);
        alert("Clé copié dans le presse-papier !");
      }
    }

    loadKey();
  </script>
</body>
</html>
