<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>AimStore – En ligne</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#090d16;--panel:#111827;--line:#27305a;--text:#f3f4f6;--mute:#94a3b8;--in:#34d399;--out:#fbbf24;--bad:#f87171}
@media (prefers-color-scheme:light){:root{--bg:#f4f5fb;--panel:#fff;--line:#d9dcef;--text:#111827;--mute:#5b6478;--in:#047857;--out:#b45309;--bad:#b91c1c}}
*{box-sizing:border-box;margin:0}
body{font-family:'Poppins',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:grid;place-items:center;padding:20px}
main{width:100%;max-width:520px}
h1{font-size:1.1rem;font-weight:600;margin-bottom:18px}
.total{font-size:4.5rem;font-weight:700;line-height:1;margin-bottom:6px}
.sub{color:var(--mute);font-size:.85rem;margin-bottom:22px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.box{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px}
.box b{display:block;font-size:2rem}
.box span{color:var(--mute);font-size:.82rem}
.in b{color:var(--in)}.out b{color:var(--out)}
form{display:flex;gap:8px}
input{flex:1;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--text);font:inherit}
button{padding:12px 18px;border:0;border-radius:10px;background:#4f46e5;color:#fff;font:600 .9rem inherit;font-family:inherit;cursor:pointer}
:focus-visible{outline:2px solid #818cf8;outline-offset:2px}
#msg{margin-top:14px;font-size:.8rem;color:var(--mute);min-height:1.2em}#msg.err{color:var(--bad)}
.hidden{display:none}
</style>
</head>
<body>
<main>
  <h1>Utilisateurs en ligne</h1>
  <form id="login">
    <input id="key" type="password" placeholder="Clé admin (STATS_KEY)" autocomplete="off" required>
    <button>Afficher</button>
  </form>
  <section id="stats" class="hidden">
    <div class="total" id="total">0</div>
    <div class="sub">en ligne en ce moment</div>
    <div class="row">
      <div class="box in"><b id="in">0</b><span>connectés</span></div>
      <div class="box out"><b id="out">0</b><span>en ligne, déconnectés</span></div>
    </div>
  </section>
  <div id="msg"></div>
</main>
<script>
const $=id=>document.getElementById(id);let timer=null;
const msg=(t,e)=>{$('msg').textContent=t||'';$('msg').classList.toggle('err',!!e)};
async function load(){
  const key=sessionStorage.getItem('stats_key');if(!key)return;
  try{
    const r=await fetch('/api/admin/online',{headers:{Authorization:'Bearer '+key},cache:'no-store'});
    if(r.status===401){sessionStorage.removeItem('stats_key');stop();$('login').classList.remove('hidden');$('stats').classList.add('hidden');return msg('Clé incorrecte.',true)}
    if(!r.ok)return msg('Serveur indisponible, nouvel essai dans 15 s.',true);
    const d=await r.json();
    $('total').textContent=d.total;$('in').textContent=d.connected;$('out').textContent=d.loggedOut;
    $('login').classList.add('hidden');$('stats').classList.remove('hidden');
    msg('Mis à jour à '+new Date(d.at).toLocaleTimeString('fr-FR'));
  }catch(e){msg('Pas de connexion réseau.',true)}
}
function stop(){clearInterval(timer);timer=null}
function start(){load();stop();timer=setInterval(load,15000)}
$('login').addEventListener('submit',e=>{e.preventDefault();sessionStorage.setItem('stats_key',$('key').value.trim());$('key').value='';start()});
if(sessionStorage.getItem('stats_key'))start();
</script>
</body>
</html>
